name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend_build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Lint
      run: npm run lint || true

    - name: Build Frontend
      run: npm run build
      env:
        VITE_BASE44_APP_ID: demo-app
        VITE_BASE44_APP_BASE_URL: https://app.base44.app

  contract_check:
    name: Smart Contract Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Build Contract (WASM Release)
      run: |
        cd contracts/gas_chain
        cargo build --locked --target wasm32-unknown-unknown --release

    - name: Run Contract Tests
      run: |
        cd contracts/gas_chain
        cargo test --locked

  deploy_notification:
    name: Deployment Summary
    needs: [frontend_build, contract_check]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Verify All Jobs Passed
      run: |
        if [ "${{ needs.frontend_build.result }}" != "success" ] || [ "${{ needs.contract_check.result }}" != "success" ]; then
          echo "❌ CI Pipeline Failed"
          exit 1
        fi
        echo "✅ Full stack build passed (Frontend + Contracts) — Ready for production deployment."
